# SPDX-License-Identifier: MIT
name: test
on: [push, pull_request]
permissions:
  contents: read
env:
  WAVE_REQUIRE_SAN: "1"
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: macos-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: sh tests/run.sh
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: emscripten-core/emsdk
          ref: dd8e25632640cfc1fb570c7fa4cc374e8a5e5a72 # Release 6.0.11; matches Felucca CI
          path: build/emsdk
          persist-credentials: false
      - name: Test with coherent Emscripten SDK
        shell: bash
        run: |
          build/emsdk/emsdk install 6.0.11
          build/emsdk/emsdk activate 6.0.11
          source build/emsdk/emsdk_env.sh
          WAVE_REQUIRE_WASM=1 sh tests/wave_small.sh
